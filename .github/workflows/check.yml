name: Check
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per check, so each passes or fails on its own line in the pull
  # request.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - run: go test ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - run: go vet ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Check Go formatting
        run: test -z "$(gofmt -l internal packages)"

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: oxfmt
      - run: oxfmt --check .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          # actionlint runs shellcheck over every run: script when it is found.
          install_args: actionlint shellcheck
      - run: actionlint

  # Only what the pull request touches is validated, and every package says
  # for itself where it is built and whether rebuilding it here is affordable.
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - id: plan
        name: Ask the changed packages where they build
        # bash rather than the default shell, so a failure anywhere in these
        # pipelines fails the step instead of being swallowed.
        shell: bash
        env:
          # Empty for workflow_dispatch, which validates every package.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE" ]]; then
            mapfile -t CHANGED < <(git diff --name-only "$BASE" HEAD -- packages | cut -d/ -f2,3 | sort -u)
          else
            mapfile -t CHANGED < <(find packages -mindepth 2 -maxdepth 2 -type d -printf '%P\n' | sort)
          fi
          TARGETS=
          for PACKAGE in "${CHANGED[@]}"; do
            # A project README, or a package that was removed, is nothing to
            # build.
            [[ -f "packages/$PACKAGE/main.go" ]] || continue
            # One target per Fedora release, carrying the rest of the config.
            TARGETS+=$(go run "packages/$PACKAGE/main.go" config | jq -Rnc --arg package "$PACKAGE" '
              [inputs | capture("^(?<key>[^=]*)=(?<value>.*)$")] | from_entries |
              {package: $package, rebuild: (.rebuild == "true"), verify} +
                (.releases | split(" ")[] | {fedora: .})')
          done
          PLAN=$(jq -sc . <<<"$TARGETS")
          {
            echo "packages=$(jq -c 'map(.package) | unique' <<<"$PLAN")"
            echo "targets=$PLAN"
          } | tee -a "$GITHUB_OUTPUT"

  # A generated spec must be exactly what its definition produces, so a hand
  # edit to a spec file, or a definition change without a regenerated spec,
  # fails here.
  spec:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Regenerate the spec file at its packaged version
        run: go run "packages/${{ matrix.package }}/main.go" gen
      - name: Check the committed spec matches its definition
        run: git diff --exit-code -- "packages/${{ matrix.package }}"

  # One job per package and Fedora release it targets. The build target is the
  # job environment itself; no nested containers.
  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Prepare the Fedora job container
        run: dnf -y --setopt=install_weak_deps=False install git-core tar gzip xz
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: srpm
        uses: ./.github/actions/source-rpm
        with:
          package: ${{ matrix.package }}

      # Only packages that ask for it are rebuilt, because a full rebuild is
      # affordable for repackaged binaries and prohibitive for a large source
      # build.
      - if: matrix.rebuild
        name: Rebuild the binary RPM
        env:
          SRPM: ${{ steps.srpm.outputs.srpm }}
        run: |
          dnf -y --setopt=install_weak_deps=False install dnf-plugins-core desktop-file-utils
          dnf -y --setopt=install_weak_deps=False builddep "$SRPM"
          rpmbuild --rebuild --define "_topdir $PWD/dist" "$SRPM"
      - if: matrix.rebuild
        name: Install the binary RPM
        run: dnf -y --setopt=install_weak_deps=False install dist/RPMS/*/*.rpm
      # The package says how to prove its installation works.
      - if: matrix.rebuild && matrix.verify != ''
        name: Run what the binary RPM installs
        env:
          VERIFY: ${{ matrix.verify }}
        run: $VERIFY
